<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Rusça Ekran · Durumum</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#13161e;--panel2:#1a1e28;--line:#262b38;--txt:#f2f4f8;--mut:#8b93a3;--brand:#ff4d3d;--brand2:#ff7a45;--ok:#22c55e;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);text-decoration:none}
.logo{font-weight:800;font-size:18px}.logo b{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 10px;font-weight:600}
.league{position:relative;overflow:hidden}
.league .glow{position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;filter:blur(70px);opacity:.35}
.league .row1{display:flex;align-items:center;gap:14px}
.league .ic{font-size:46px;line-height:1}
.league h2{font-size:22px}.league .sub{color:var(--mut);font-size:13px;margin-top:3px}
.prog{height:10px;background:var(--bg);border-radius:10px;overflow:hidden;margin:16px 0 8px}
.prog i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width 1s ease-out}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:800}.kpi small{color:var(--mut);font-size:11px}
.rankline{margin-top:12px;font-size:13px;color:var(--mut);text-align:center}
.goal{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .gi{width:42px;height:42px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.goal.done .gi{background:#12301f}
.goal .gt{flex:1;min-width:0}.goal .gt b{display:block;font-size:14px}
.goal .bar2{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:7px}
.goal .bar2 i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .8s ease-out}
.goal.done .bar2 i{background:var(--ok)}
.goal .gm{font-size:12px;color:var(--mut);margin-top:4px}
.goal .bonus{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.goal.done .bonus{color:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.bd .e{font-size:28px}.bd small{display:block;font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.25}
.bd.off{opacity:.3;filter:grayscale(1)}
.bd .x{display:inline-block;font-size:10px;font-weight:800;background:var(--brand);color:#fff;border-radius:999px;padding:1px 6px;margin-top:4px}
.lvrow{display:flex;align-items:center;gap:12px}
.lvbadge{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.lvrow .t{flex:1}.lvrow .t b{display:block}.lvrow .t small{color:var(--mut);font-size:12px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font:700 14px Inter,system-ui;text-align:center;text-decoration:none;color:var(--txt)}
.cta{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;font:800 16px Inter,system-ui;margin:12px 0;cursor:pointer;text-align:center;text-decoration:none}
.empty{color:var(--mut);text-align:center;padding:30px 10px;line-height:1.5}
.sk{height:120px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,#13161e,#1a1e28,#13161e);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.reset{font-size:12px;color:var(--mut);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><a class="icon-btn" href="youtube.html">‹</a><div class="logo">Rusça<b>Ekran</b></div><span data-auth-chip></span></div>
  <div data-release-banner></div>
  <div id="root"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>
<script src="config.js?v=9"></script>
<script src="auth.js?v=10"></script>
<script src="clips.js?v=8"></script>
<script src="notes.js?v=12"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEVELS={A1:["Başlangıç","#22c55e"],A2:["Temel","#14b8a6"],B1:["Orta","#3b82f6"],B2:["İyi","#a855f7"],C1:["İleri","#ff4d3d"]};
function daysToMonday(){const now=new Date(Date.now()+3*3600e3);const d=now.getUTCDay();const left=(8-(d||7))%7||7;return left}
async function load(){
  if(!Auth.user()){
    $("root").innerHTML=`<div class="card empty">📊<br><b style="color:var(--txt);font-size:17px">Durumunu görmek için giriş yap</b><br>Lig sıralaman, haftalık hedeflerin ve rozetlerin burada.</div><button class="cta" onclick="Auth.open('register')">Üye ol</button><button class="cta" style="background:var(--panel2)" onclick="Auth.open('login')">Giriş yap</button>`;return}
  const p=await Auth.call("profile",{token:Auth.token()});
  if(!p.ok){$("root").innerHTML=`<div class="card empty">${esc(p.error||"Bilgiler alınamadı.")}</div>`;return}
  const lg=Auth.league(p.week);const L=[...Auth.LEAGUES].reverse();const i=L.findIndex(x=>x.name===lg.name);const nx=L[i+1];
  const pct=nx?Math.min(100,(p.week-lg.min)/(nx.min-lg.min)*100):100;
  const lv=LEVELS[p.level];
  const clips=(window.CLIPS||[]),V=window.VIDEOS||{};
  const myLvlClips=p.level?clips.filter(c=>(V[c.v]||{}).lvl===p.level):[];
  const seen=new Set(p.seen||[]);const unseen=myLvlClips.filter(c=>!seen.has(c.v+"@"+c.s)).length;
  const goalsDone=p.goals.filter(g=>g.done).length;
  const earned={};(p.badges||[]).forEach(b=>{earned[b.id]=(earned[b.id]||0)+1});
  const weekly=[{id:"g50",icon:"🎯",title:"Haftalık 50"},{id:"gdays",icon:"📅",title:"5 gün"},{id:"gacc",icon:"👂",title:"Keskin kulak"},{id:"gstreak",icon:"🔥",title:"Seri ustası"}];
  const allBadges=[...p.milestones,...weekly];
  $("root").innerHTML=`
  <div class="card league"><div class="glow" style="background:${lg.col}"></div>
    <div class="row1"><div class="ic">${lg.icon}</div><div><h2 style="color:${lg.col}">${lg.name} lig</h2><div class="sub">Bu hafta <b style="color:var(--txt)">${p.week}</b> puan · ${p.username}</div></div></div>
    <div class="prog"><i id="lp"></i></div>
    <div class="prog-l"><span>${lg.icon} ${lg.min}</span><span>${nx?`${nx.icon} ${nx.name} için <b style="color:var(--txt)">${nx.min-p.week}</b> puan`:"En üst ligdesin! 💎"}</span></div>
    <div class="kpis"><div class="kpi"><b>#${p.rank||"–"}</b><small>Haftalık sıra</small></div><div class="kpi"><b>${p.weekStats.n}</b><small>Bu hafta sahne</small></div><div class="kpi"><b>${p.weekStats.n?Math.round(p.weekStats.right/p.weekStats.n*100)+"%":"–"}</b><small>Haftalık doğruluk</small></div></div>
    <div class="rankline">${p.rank===1?"🥇 Bu hafta liderliktesin!":p.aboveName?`<b style="color:var(--txt)">${esc(p.aboveName)}</b>'ı geçmek için <b style="color:var(--txt)">${p.gapToAbove}</b> puan`:""} · ${p.members} üye</div>
  </div>
  <a class="btn" href="lig.html" style="display:block;margin-bottom:6px">🏆 Lig tablosunun tamamı</a>
  <a class="btn" href="#" data-feedback style="display:block;margin-bottom:6px">💬 Görüş & öneri gönder</a>

  <div class="sec">Haftalık hedefler · ${goalsDone}/${p.goals.length}</div>
  <div class="card" style="padding:6px 18px">${p.goals.map(g=>{
    const meta=g.id==="gacc"?(g.n<g.min?`${g.n}/${g.min} sahne, sonra %${g.target} doğruluk`:`Şu an %${g.cur} · hedef %${g.target}`):`${Math.min(g.cur,g.target)}/${g.target}`;
    return`<div class="goal ${g.done?"done":""}"><div class="gi">${g.done?"✅":g.icon}</div><div class="gt"><b>${esc(g.title)}</b><div class="bar2"><i style="width:${Math.round(g.pct*100)}%"></i></div><div class="gm">${g.done?"Tamamlandı":meta}</div></div><div class="bonus">${g.done?"✓ ":""}+${g.bonus}</div></div>`}).join("")}</div>
  <div class="reset">Hedefler ${daysToMonday()} gün sonra (pazartesi, Moskova saati) yenilenir. Her hedef bonus puan ve rozet kazandırır.</div>

  <div class="sec">Seviyem</div>
  <div class="card"><div class="lvrow"><div class="lvbadge" style="background:${lv?lv[1]:"var(--panel2)"}">${p.level||"?"}</div><div class="t"><b>${lv?`${p.level} · ${lv[0]}`:"Seviye seçilmedi"}</b><small>${lv?`${myLvlClips.length} sahne · ${unseen} tanesi yeni`+(p.placed?` · sınav: ${p.placed}`:""):"Video modunda sınava gir ya da seviyeni seç"}</small></div></div>
    <div class="btnrow"><a class="btn" href="youtube.html#seviye">✏️ Seviyeyi değiştir</a><a class="btn" href="youtube.html#sinav">🧭 Sınava gir</a></div></div>

  <div class="sec">Rozetler · ${Object.keys(earned).length}/${allBadges.length}</div>
  <div class="badges">${allBadges.map(b=>`<div class="bd ${earned[b.id]?"":"off"}"><div class="e">${b.icon}</div><small>${esc(b.title)}</small>${earned[b.id]>1?`<span class="x">×${earned[b.id]}</span>`:""}</div>`).join("")}</div>

  <div class="sec">Tüm zamanlar</div>
  <div class="card"><div class="kpis" style="margin-top:0"><div class="kpi"><b>${p.total}</b><small>Toplam puan</small></div><div class="kpi"><b>${p.played}</b><small>Cevaplanan</small></div><div class="kpi"><b>🔥${p.best}</b><small>En iyi seri</small></div></div></div>
  <a class="cta" href="youtube.html">🎬 Oyna ve puan topla</a>`;
  requestAnimationFrame(()=>setTimeout(()=>{const e=$("lp");if(e)e.style.width=pct+"%"},60));
}
document.addEventListener("auth-change",load);
load();
</script>
</body>
</html>
